<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umair Mazhar - AI Study Buddy</title>
  <style>
    body { background: #0a0e1a; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { display: flex; justify-content: space-between; padding: 20px 50px; }
    header h1 { color: #3b82f6; }
    nav a { color: #fff; margin: 0 15px; text-decoration: none; }
    .container { max-width: 700px; margin: 50px auto; padding: 20px; text-align: center; }
    .chat-box { background: #111827; border-radius: 15px; padding: 20px; min-height: 300px; }
    .badge { background: #1e3a8a; padding: 10px 15px; border-radius: 10px; display: inline-block; margin-bottom: 15px; }
    input { width: 80%; padding: 12px; border-radius: 8px; border: none; margin-top: 10px; }
    button { padding: 12px 20px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; cursor: pointer; margin-top: 10px; }
    .user { color: #60a5fa; margin-top: 10px; }
    .ai { color: #34d399; margin-top: 10px; }
    .error { color: #ef4444; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Umair Mazhar</h1>
    <nav>
      <a href="#">About</a>
      <a href="#">Projects</a>
      <a href="#">Skills</a>
      <a href="#">AI Study Buddy</a>
    </nav>
  </header>

  <div class="container">
    <p>Ask me anything and I'll explain it to you</p>
    <div class="chat-box">
      <div class="badge">💡 Hey! I'm your AI Study Buddy. Ask me: "Explain Newton's 3rd Law"</div>
      <div id="chat"></div>
      <input type="text" id="userInput" placeholder="Ask a question..." />
      <br>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chat = document.getElementById('chat');
      const question = input.value;
      if (!question) return;

      chat.innerHTML += `<div class="user"><b>You:</b> ${question}</div>`;
      input.value = '';

      try {
        const response = await fetch('/api/groq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        const data = await response.json();
        
        if (!response.ok) throw new Error(data.error?.message || "API Error")

        const reply = data.choices[0].message.content;
        chat.innerHTML += `<div class="ai"><b>AI:</b> ${reply}</div>`;

      } catch (error) {
        chat.innerHTML += `<div class="error">Error: ${error.message}</div>`;
      }
    }
  </script>
</body>
</html>
